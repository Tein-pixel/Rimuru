name: Patch Rimuru APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  patch-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install apktool
        run: |
          mkdir -p $HOME/bin
          APKTOOL_VERSION="2.9.3"
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" \
               -O $HOME/bin/apktool.jar
          cat > $HOME/bin/apktool << 'SCRIPT'
          #!/bin/bash
          java -jar $HOME/bin/apktool.jar "$@"
          SCRIPT
          chmod +x $HOME/bin/apktool
          echo "$HOME/bin" >> $GITHUB_PATH
          apktool --version

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner
          zipalign --version || true
          apksigner version || true

      # ── INI BAGIAN YANG DIUBAH ──
      - name: Download APK from Release
        run: |
          # Pastikan nama file di Release lu persis "original.apk"
          # Kalau namanya beda (misal: rimuru.apk), ganti di bagian akhir link ini
          wget -q "https://github.com/Tein-pixel/Rimuru/releases/download/v1.0/original.apk" -O original.apk
          
          if [ ! -f original.apk ]; then
            echo "ERROR: Gagal download APK. Cek apakah nama file di Release sudah 'original.apk' dan tag-nya 'v1.0'."
            exit 1
          fi
          echo "Input APK size: $(du -sh original.apk | cut -f1)"

      - name: Patch smali + SharedPrefs
        run: |
          python3 patch_apk.py 2>&1 | tee patch_log.txt
          if [ ! -f rimuru_patched.apk ]; then
            echo "ERROR: patch_apk.py did not produce rimuru_patched.apk"
            cat patch_log.txt
            exit 1
          fi
          echo "Patched APK size: $(du -sh rimuru_patched.apk | cut -f1)"

      - name: Zipalign patched APK
        run: |
          zipalign -v 4 rimuru_patched.apk rimuru_aligned.apk
          echo "Aligned APK size: $(du -sh rimuru_aligned.apk | cut -f1)"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore rimuru_debug.keystore \
            -alias rimuru \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass rimuru123 \
            -keypass rimuru123 \
            -dname "CN=Rimuru,OU=Crack,O=Storm,L=Tower,S=Wild,C=ID"
          echo "Keystore generated."

      - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks rimuru_debug.keystore \
            --ks-pass pass:rimuru123 \
            --key-pass pass:rimuru123 \
            --ks-key-alias rimuru \
            --out rimuru_cracked_signed.apk \
            rimuru_aligned.apk

          apksigner verify rimuru_cracked_signed.apk && \
            echo "Signature verification: PASSED" || \
            echo "Signature verification: FAILED (may still install)"

          echo "Final APK size: $(du -sh rimuru_cracked_signed.apk | cut -f1)"

      - name: Upload cracked APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rimuru-cracked-${{ github.run_number }}
          path: |
            rimuru_cracked_signed.apk
            patch_log.txt
          retention-days: 7
          if-no-files-found: error

      - name: Job summary
        run: |
          echo "## Rimuru APK Patch Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| original.apk | $(du -sh original.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| rimuru_cracked_signed.apk | $(du -sh rimuru_cracked_signed.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Patch Log (tail)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 patch_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
